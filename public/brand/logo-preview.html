<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silicortex logo files</title>
<style>
  body { margin: 0; padding: 32px 16px; font: 14px/1.5 system-ui, sans-serif; background: #f5f7fb; color: #101D46; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; max-width: 1100px; }
  figure { margin: 0; border-radius: 12px; padding: 20px; display: grid; place-items: center; gap: 10px; border: 1px solid #e3e7ee; }
  img { width: 120px; height: 120px; }
  figcaption { font-size: 12px; color: #7d8aa3; }
  .sizes { display: flex; align-items: end; gap: 16px; margin-top: 24px; }
</style></head><body>
<h1>Silicortex — logo files (generated by scripts/build-logo.mjs)</h1>
<div class="grid">
<figure style="background:#ffffff"><img src="silicortex-symbol-light.svg" alt=""><figcaption>symbol · light</figcaption></figure>
<figure style="background:#101D46"><img src="silicortex-symbol-dark.svg" alt=""><figcaption>symbol · dark</figcaption></figure>
<figure style="background:#020617"><img src="silicortex-symbol-dark.svg" alt=""><figcaption>symbol · dark (site)</figcaption></figure>
<figure style="background:#ffffff"><img src="silicortex-symbol-mono-blue.svg" alt=""><figcaption>mono blue</figcaption></figure>
<figure style="background:#ffffff"><img src="silicortex-symbol-mono.svg" alt=""><figcaption>mono navy</figcaption></figure>
<figure style="background:#101D46"><img src="silicortex-symbol-mono-white.svg" alt=""><figcaption>mono white</figcaption></figure>
<figure style="background:#f5f7fb"><img src="silicortex-icon-light.svg" alt=""><figcaption>app icon · light</figcaption></figure>
<figure style="background:#f5f7fb"><img src="silicortex-icon.svg" alt=""><figcaption>app icon · dark</figcaption></figure>
<figure style="background:#f5f7fb"><img src="apple-touch-icon.png" alt=""><figcaption>apple touch icon</figcaption></figure>
</div>
<h1 style="margin-top:24px">App icon at 16, 24, 32, 48, 128 px</h1>
<div class="sizes"><img src="silicortex-icon.svg" style="width:16px;height:16px" alt=""><img src="silicortex-icon.svg" style="width:24px;height:24px" alt=""><img src="silicortex-icon.svg" style="width:32px;height:32px" alt=""><img src="silicortex-icon.svg" style="width:48px;height:48px" alt=""><img src="silicortex-icon.svg" style="width:128px;height:128px" alt=""></div>
</body></html>
